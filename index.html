<!DOCTYPE html>
<html lang="en">
<head>
    <title>8D Audio Music Production</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="https://8daudiomusicpro.github.io/8daudiomusicpr/logo.png.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #fafafa;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .box {
            width: 350px;
            background: #fff;
            padding: 30px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .box h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .input-box {
            width: 100%;
            margin-bottom: 15px;
        }
        .input-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #0078e6;
        }
        .switch {
            margin-top: 20px;
            font-size: 14px;
        }
        .switch a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="login-box">
            <h2>Login</h2>
            <div class="input-box">
                <input type="email" id="login-email" placeholder="Email" required>
            </div>
            <div class="input-box">
                <input type="password" id="login-password" placeholder="Password" required>
            </div>
            <button class="btn" id="login-btn">Login</button>
            <p class="switch">Don't have an account? <a href="https://8daudiomusicpro.github.io/sign-up/" id="register-link">Sign Up</a></p>
            <p id="login-error" style="color: red; font-size: 14px;"></p>
        </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCL5UmHfiSao6e3HdoZwVv-fUCOpe7fp58",
            authDomain: "login-96909.firebaseapp.com",
            projectId: "login-96909",
            storageBucket: "login-96909.appspot.com",
            messagingSenderId: "1041589784359",
            appId: "1:1041589784359:web:a213e9d92307d5b831a302"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth();

        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('login-error');
            
            signInWithEmailAndPassword(auth, email, password)
                .then(userCredential => {
                    alert("Login Successful");
                    window.location.href = "https://8daudiomusicpro.github.io/8daudiomusicpr/?";
                })
                .catch(error => {
                    errorMsg.innerText = "Wrong email or password. Please try again.";
                });
        });

        document.getElementById('register-btn').addEventListener('click', () => {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const errorMsg = document.getElementById('register-error');
            
            createUserWithEmailAndPassword(auth, email, password)
                .then(userCredential => {
                    alert("Registration Successful. Please login.");
                    document.getElementById('register-box').style.display = 'none';
                    document.getElementById('login-box').style.display = 'block';
                })
                .catch(error => {
                    errorMsg.innerText = error.message;
                });
        });

        document.getElementById('register-link').addEventListener('click', () => {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('register-box').style.display = 'block';
        });
        
        document.getElementById('login-link').addEventListener('click', () => {
            document.getElementById('register-box').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
        });
    </script>
</body>
</html>
